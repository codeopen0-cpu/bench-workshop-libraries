# After a library is merged: pack every library folder into libraries/*.benchlib and rewrite
# index.json (the list the app downloads), then commit them.
name: Pack the library list
on:
  push:
    branches: [main]
    paths: ['src/**', 'tools/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: pack
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/pack.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libraries index.json
          git diff --cached --quiet || (git commit -m "Pack the library list" && git push)
